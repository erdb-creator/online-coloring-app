<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">
  <title>ColorVerse - Online Coloring App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    body{font-family:Inter,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
    .canvas-bg{background-color:#1e293b;background-image:linear-gradient(45deg,#0f172a 25%,transparent 25%),linear-gradient(-45deg,#0f172a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#0f172a 75%),linear-gradient(-45deg,transparent 75%,#0f172a 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
    input[type=range]{accent-color:#6366f1}
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden">
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center"><i class="fa-solid fa-wand-magic-sparkles"></i></div><div><h1 class="font-bold text-lg">ColorVerse <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full">HD Studio</span></h1><p class="text-xs text-slate-400 hidden sm:block">Güvenli çevrim içi boyama uygulaması</p></div></div>
    <div class="flex items-center gap-2"><button id="openImageModalBtn" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700"><i class="fa-solid fa-image text-indigo-400 mr-1"></i><span class="hidden md:inline">Görsel Değiştir</span></button><div class="flex items-center bg-slate-800 rounded-lg border border-slate-700"><button id="undoBtn" title="Geri al" class="p-2 disabled:opacity-30" disabled><i class="fa-solid fa-rotate-left text-xs"></i></button><button id="redoBtn" title="Yinele" class="p-2 disabled:opacity-30" disabled><i class="fa-solid fa-rotate-right text-xs"></i></button></div><button id="clearCanvasBtn" title="Temizle" class="p-2 text-rose-400 rounded-lg border border-rose-500/20"><i class="fa-solid fa-trash-can text-xs"></i></button><button id="exportBtn" class="px-3 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 rounded-lg"><i class="fa-solid fa-download mr-1"></i><span class="hidden sm:inline">PNG İndir</span></button></div>
  </header>
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
    <main id="workspace" class="flex-1 relative canvas-bg overflow-hidden flex items-center justify-center cursor-crosshair">
      <div id="canvasViewport" class="absolute origin-center shadow-2xl rounded-lg overflow-hidden border border-slate-700/50"><canvas id="paintCanvas" class="absolute top-0 left-0 z-10"></canvas><canvas id="lineCanvas" class="absolute top-0 left-0 z-20 pointer-events-none"></canvas></div>
      <div id="canvasLoader" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-40 flex flex-col items-center justify-center gap-3"><div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div><p id="loaderText" class="text-sm text-slate-300">Hazırlanıyor...</p></div>
      <div class="absolute bottom-4 left-4 z-30 flex items-center gap-1 bg-slate-900/90 border border-slate-800 p-1 rounded-xl"><button id="zoomInBtn" class="p-2" title="Yaklaştır"><i class="fa-solid fa-magnifying-glass-plus text-xs"></i></button><span id="zoomLevelText" class="text-xs font-semibold px-2 text-indigo-400 min-w-[3rem] text-center">100%</span><button id="zoomOutBtn" class="p-2" title="Uzaklaştır"><i class="fa-solid fa-magnifying-glass-minus text-xs"></i></button><button id="resetZoomBtn" class="p-2" title="Sıfırla"><i class="fa-solid fa-expand text-xs"></i></button></div>
    </main>
    <aside class="w-full md:w-80 bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 p-3 overflow-y-auto shrink-0">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Araçlar</h2><div class="grid grid-cols-4 gap-2 mb-3"><button data-tool="fill" class="tool active p-2 rounded-xl border border-indigo-500/50 bg-indigo-600/20 text-indigo-400"><i class="fa-solid fa-fill-drip block mb-1"></i><span class="text-[11px]">Dolgu</span></button><button data-tool="brush" class="tool p-2 rounded-xl border border-slate-800 text-slate-400"><i class="fa-solid fa-paint-brush block mb-1"></i><span class="text-[11px]">Fırça</span></button><button data-tool="eraser" class="tool p-2 rounded-xl border border-slate-800 text-slate-400"><i class="fa-solid fa-eraser block mb-1"></i><span class="text-[11px]">Silgi</span></button><button data-tool="pan" class="tool p-2 rounded-xl border border-slate-800 text-slate-400"><i class="fa-solid fa-hand block mb-1"></i><span class="text-[11px]">Taşı</span></button></div>
      <div class="bg-slate-950/50 p-3 rounded-xl border border-slate-800 mb-3"><label class="text-xs text-slate-400">Fırça boyutu <b id="brushSizeVal" class="text-indigo-400">18px</b></label><input id="brushSizeInput" type="range" min="2" max="100" value="18" class="w-full"><label class="text-xs text-slate-400 block mt-2">Dolgu toleransı <b id="toleranceVal" class="text-indigo-400">35</b></label><input id="toleranceInput" type="range" min="1" max="120" value="35" class="w-full"></div>
      <div class="flex items-center gap-3 p-2 bg-slate-950/80 rounded-xl border border-slate-800 mb-3"><div id="activeColorPreview" class="w-10 h-10 rounded-lg border border-white/20" style="background:#ef4444"></div><div class="flex-1"><div class="text-[10px] uppercase text-slate-500">Aktif renk</div><div id="activeColorLabel" class="text-xs font-semibold">Vivid Red</div></div><input type="color" id="customColorPicker" value="#ef4444" class="w-8 h-8 bg-transparent"></div>
      <div id="solidSwatchesContainer" class="grid grid-cols-6 gap-2"></div>
      <div class="mt-4 flex items-center gap-2"><span class="text-xs text-slate-400">Özel gradyan:</span><input type="color" id="gradColor1" value="#f43f5e" class="w-7 h-7"><input type="color" id="gradColor2" value="#3b82f6" class="w-7 h-7"><button id="gradientToggle" class="text-xs px-2 py-1 rounded bg-slate-800">Gradyan</button></div>
    </aside>
  </div>
  <div id="imageModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden"><div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 space-y-4"><div class="flex justify-between"><h3 class="font-bold">Line-art görseli seç</h3><button id="closeImageModalBtn"><i class="fa-solid fa-xmark"></i></button></div><button data-preset="mandala" class="w-full p-2 bg-slate-800 rounded-lg text-sm">Örnek mandala</button><button data-preset="castle" class="w-full p-2 bg-slate-800 rounded-lg text-sm">Örnek kale</button><input type="url" id="imageUrlInput" placeholder="https://example.com/image.png" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs"><button id="loadUrlBtn" class="w-full px-3 py-2 bg-indigo-600 rounded-lg text-xs">URL'den yükle</button><input type="file" id="localFileInput" accept="image/png,image/jpeg,image/webp,image/avif" class="w-full text-xs text-slate-400"></div></div>
  <script src="app.js" defer></script>
</body>
</html>
